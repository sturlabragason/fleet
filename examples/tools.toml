# Example ~/.fleet/tools.toml. Copy what you need:
#   mkdir -p ~/.fleet && cp examples/tools.toml ~/.fleet/tools.toml
#
# Each [section] is a profile name for `fleet spawn <name> <profile>`.
# Fields override the built-in profile of the same name, or define a new one.
#   command    program to run (looked up on the login PATH)
#   args       extra arguments, always passed
#   env        environment for the agent; $VAR and ${VAR} are expanded
#   launch_id  arguments that set a session id at launch ({id} = new UUID)
#   resume     arguments that resume a session ({id}); used by park/wake (planned)
#   prompt_args, mode_args, session_path, subagent_log, peer_args, hook_args: see internal/tools/tools.go
#   A profile whose command is claude or copilot takes that built-in's peer_args
#   and hook_args unless it sets them ([] = none) (ADR-80).
#   user_mcp_config, user_mcp_off: the tool's file of global MCP servers and the
#   args that switch them off for workers; inherited the same way, [] = keep
#   them all (ADR-91).
#   plugin_args, plugin_mcp: load fleet's per-agent plugin ({plugin}) with the
#   status hooks and, for copilot, fleet-peer; inherited the same way (ADR-99).
#   patterns   status pattern set: copilot, claude, agy, vibe or fake
# Give every profile you define a mode_args "auto" key with that tool's
# allow-all flag, or `mode = "auto"` in config.toml cannot reach it and the
# agent keeps asking for permission (ADR-56).
# Placeholders: {fleet} = fleet binary, {name} = agent name, {id} = session id.

# Claude model through the Copilot CLI.
[claude-copilot]
command = "copilot"
args = ["--model", "claude-opus-5.5"]
launch_id = ["--session-id", "{id}"]
resume = ["--resume", "{id}"]
patterns = "copilot"

# Two Claude Code accounts, kept apart by config directory.
[claude-personal]
command = "claude"
args = ["--model", "opus"]
prompt_args = ["{prompt}"]
mode_args = { auto = "--permission-mode bypassPermissions", accept-edits = "--permission-mode acceptEdits", plan = "--permission-mode plan", bypass = "--permission-mode bypassPermissions" }
env = { CLAUDE_CONFIG_DIR = "$HOME/.claude-personal" }
launch_id = ["--session-id", "{id}"]
resume = ["--resume", "{id}"]
session_path = "~/.claude-personal/projects/*/{id}.jsonl"
peer_args = ["--mcp-config", "{peer_mcp_claude}"]
patterns = "claude"
acp_from = "claude"  # --driver acp uses the built-in claude adapter (ADR-76)

[claude-work]
command = "claude"
args = ["--model", "opus"]
prompt_args = ["{prompt}"]
mode_args = { auto = "--permission-mode bypassPermissions", accept-edits = "--permission-mode acceptEdits", plan = "--permission-mode plan", bypass = "--permission-mode bypassPermissions" }
env = { CLAUDE_CONFIG_DIR = "$HOME/.claude-work" }
launch_id = ["--session-id", "{id}"]
resume = ["--resume", "{id}"]
session_path = "~/.claude-work/projects/*/{id}.jsonl"
peer_args = ["--mcp-config", "{peer_mcp_claude}"]
patterns = "claude"
acp_from = "claude"  # --driver acp uses the built-in claude adapter (ADR-76)

