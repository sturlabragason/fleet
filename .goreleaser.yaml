# Release build (ADR-73). Run by .github/workflows/release.yml; locally:
#   goreleaser release --snapshot --clean
version: 2

project_name: fleet

builds:
  - id: fleet
    main: ./cmd/fleet
    binary: fleet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X main.channel=release

archives:
  - formats: [binary]
    name_template: "fleet-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

# The release body is CHANGELOG.md's new lines, passed as --release-notes
# (scripts/release-notes.sh). Don't set changelog.disable: it skips the whole
# changelog pipe, --release-notes included, and the body comes out empty.
changelog:
  use: git

release:
  github:
    owner: sturlabragason
    name: fleet
  name_template: "{{ .Tag }}"
  # The one-line installer, attached so a release carries the script that
  # installs it (ADR-78).
  extra_files:
    - glob: ./install.sh
