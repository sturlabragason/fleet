name: ci

# Agents push fleet/* branches and merge into local main only once this is
# green, so the heavy checks run here instead of on the user's laptop (ADR-69).
on:
  push:
    branches: [main, "fleet/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pre-push hook's check, run for pushes from any clone and for PRs.
  # Private deny patterns and allowed emails come from repository secrets, never the tree.
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-public_test.sh
      - run: scripts/release-notes_test.sh
      - run: scripts/release-lock_test.sh
      - run: scripts/install_test.sh
      - name: check-public on the new commits
        env:
          PUBLIC_DENY: ${{ secrets.PUBLIC_DENY }}
          PUBLIC_EMAILS: ${{ secrets.PUBLIC_EMAILS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=()
          [[ -n $PUBLIC_DENY ]] || echo "::warning::secret PUBLIC_DENY is not set: only built-in patterns are checked"
          [[ -n $PUBLIC_EMAILS ]] || { echo "::warning::secret PUBLIC_EMAILS is not set: commit emails not checked"; args+=(--no-emails); }
          if [[ $EVENT == pull_request ]]; then
            args=(--no-emails) # contributors' own emails are theirs to publish
            range=("$BASE..$HEAD_SHA")
          elif [[ -n $BEFORE && ! $BEFORE =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE..$HEAD_SHA")
          else
            range=("$HEAD_SHA" --not origin/main)
          fi
          scripts/check-public.sh "${args[@]}" "${range[@]}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make build
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go test -race ./...

  # The portable Windows fleet.exe: build it like make build, smoke-test what
  # runs without tmux, keep it as an artifact.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build fleet.exe
        env:
          CGO_ENABLED: "0"
        run: |
          v=$(git describe --tags --always --dirty)
          mkdir -p bin
          go build -trimpath -ldflags "-X main.version=$v" -o bin/fleet.exe ./cmd/fleet
          go build -o bin/fakeagent.exe ./cmd/fakeagent
          ls -l bin
      - name: Unit tests of the OS layer and self-upgrade
        run: go test ./internal/sysx/ ./internal/update/
      - name: Smoke test
        env:
          FLEET_CONFIG: ${{ runner.temp }}/no-config.toml
        run: scripts/windows-smoke.sh bin/fleet.exe
      # install.ps1 and the Scoop manifest against a local copy of a release
      # holding this build, in Windows PowerShell 5.1 as most users have it.
      - name: install.ps1 and scoop install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $v = 'v9.9.9'
          $rel = "$env:RUNNER_TEMP\rel"
          New-Item -ItemType Directory -Force "$rel\download\$v" | Out-Null
          Copy-Item bin\fleet.exe "$rel\download\$v\fleet-windows-amd64.exe"
          $h = (Get-FileHash -Algorithm SHA256 bin\fleet.exe).Hash.ToLower()
          "$h  fleet-windows-amd64.exe" | Set-Content "$rel\download\$v\SHA256SUMS"
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$rel -PassThru -WindowStyle Hidden
          try {
            Start-Sleep 3
            $env:FLEET_BASE_URL = 'http://127.0.0.1:8765'
            $env:FLEET_VERSION = $v
            $env:FLEET_INSTALL_DIR = "$env:RUNNER_TEMP\fleetbin"
            $env:FLEET_DRY_RUN = '1'; Get-Content -Raw install.ps1 | iex; $env:FLEET_DRY_RUN = ''
            if (Test-Path "$env:FLEET_INSTALL_DIR\fleet.exe") { throw 'dry run installed' }
            Get-Content -Raw install.ps1 | iex
            Get-Content -Raw install.ps1 | iex # again: an upgrade replaces it
            fleet version
            if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*fleetbin*") { throw 'not on the user PATH' }
            "$('0' * 64)  fleet-windows-amd64.exe" | Set-Content "$rel\download\$v\SHA256SUMS"
            $bad = $false
            try { Get-Content -Raw install.ps1 | iex } catch { $bad = $_.ToString() -like '*checksum mismatch*' }
            if (-not $bad) { throw 'a checksum mismatch was installed' }
            "$h  fleet-windows-amd64.exe" | Set-Content "$rel\download\$v\SHA256SUMS"

            iex "& {$(irm -UseBasicParsing get.scoop.sh)} -RunAsAdmin"
            $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
            $m = Get-Content -Raw bucket\fleet.json | ConvertFrom-Json
            $m.version = '9.9.9'
            $m.architecture.'64bit'.url = "http://127.0.0.1:8765/download/$v/fleet-windows-amd64.exe#/fleet.exe"
            $m.architecture.'64bit'.hash = $h
            $m | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\fleet.json"
            scoop install "$env:RUNNER_TEMP\fleet.json"
            if ($LASTEXITCODE) { throw "scoop install: $LASTEXITCODE" }
            & "$env:USERPROFILE\scoop\shims\fleet.exe" version
            if ($LASTEXITCODE) { throw 'scoop shim did not run fleet' }
          } finally { Stop-Process -Id $srv.Id -Force }
      - name: Claude ACP adapter handshake
        env:
          FLEET_CONFIG: ${{ runner.temp }}/no-config.toml
        run: |
          acp=$(sed -n 's/^const ClaudeACPVersion = "\(.*\)"/\1/p' internal/tools/tools.go)
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code "@agentclientprotocol/claude-agent-acp@$acp"
          command -v claude npx
          scripts/windows-smoke.sh --claude bin/fleet.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-windows-amd64
          path: bin/fleet.exe

  # install.sh (ADR-78): lint it, then install the latest release with it, as
  # a user would: curl on ubuntu, busybox sh and wget in alpine.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh
      - name: install with curl into a temp HOME
        run: |
          home=$(mktemp -d)
          HOME=$home sh install.sh --dry-run
          HOME=$home sh install.sh
          HOME=$home sh install.sh # again: an upgrade overwrites cleanly
          "$home/.local/bin/fleet" version
          dir=$(mktemp -d)
          FLEET_INSTALL_DIR=$dir FLEET_VERSION=v1.3.0 sh install.sh
          "$dir/fleet" version | grep -q '^fleet v1.3.0 '
      - name: install with busybox wget in alpine
        run: docker run --rm -v "$PWD/install.sh:/install.sh:ro" alpine:3 sh -c 'sh /install.sh && /root/.local/bin/fleet version'
